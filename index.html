    <meta name="theme-color" content="#03060f">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-deep: #03060f;
            --bg-card: rgba(10, 15, 30, 0.94);
            --neon-gold: #f5c842;
            --neon-gold-glow: #ffd700;
            --neon-violet: #c040fb;
            --neon-violet-glow: #d580ff;
            --neon-red: #ff3b3b;
            --neon-red-glow: #ff7070;
            --text: #f0f0ff;
            --text-dim: #b0b0cc;
            --border-glow: rgba(245, 200, 66, 0.5);
            --radius-card: 28px;
            --radius-btn: 16px;
            --font-heading: 'Anton', 'Arial Black', sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font-body);
            background: var(--bg-deep);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        .wrap {
            position: relative;
            z-index: 2;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            padding-top: calc(10px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            background: radial-gradient(circle at 50% 0%, rgba(245, 200, 66, 0.15), transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(192, 64, 251, 0.12), transparent 60%);
        }

        .card {
            width: 100%;
            max-width: 430px;
            max-height: 100%;
            background: var(--bg-card);
            border: 1px solid rgba(245, 200, 66, 0.25);
            border-radius: var(--radius-card);
            padding: clamp(18px, 4vh, 28px) clamp(16px, 4.5vw, 24px) clamp(14px, 3vh, 20px);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 60px rgba(245, 200, 66, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: clamp(6px, 1.4vh, 12px);
            position: relative;
            overflow: visible;
        }

        .avatar-stage {
            position: relative;
            width: clamp(105px, 28vh, 140px);
            height: clamp(105px, 28vh, 140px);
            flex-shrink: 0;
            z-index: 3;
            margin-top: 2px;
        }

        .avatar-glow {
            position: absolute;
            inset: -24px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 200, 66, 0.55) 0%, rgba(192, 64, 251, 0.45) 40%, transparent 70%);
            animation: glowPulse 2.4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {

            0%,
            100% {
                transform: scale(0.85);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .ring-1 {
            inset: -6px;
            background: conic-gradient(from 0deg, var(--neon-gold), var(--neon-violet), var(--neon-red), var(--neon-gold));
            -webkit-mask: radial-gradient(transparent 60%, black 63%);
            mask: radial-gradient(transparent 60%, black 63%);
            animation: spinClockwise 4s linear infinite;
        }

        .ring-2 {
            inset: -14px;
            background: conic-gradient(from 180deg, var(--neon-gold-glow), var(--neon-violet-glow), var(--neon-red), var(--neon-gold), var(--neon-gold-glow));
            -webkit-mask: radial-gradient(transparent 66%, black 69%);
            mask: radial-gradient(transparent 66%, black 69%);
            animation: spinCounterClockwise 6s linear infinite;
        }

        .ring-3 {
            inset: -22px;
            border: 2.5px dashed var(--neon-violet);
            animation: spinClockwise 8s linear infinite;
        }

        @keyframes spinClockwise {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes spinCounterClockwise {
            to {
                transform: rotate(-360deg);
            }
        }

        .avatar-static {
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: #0a0a14;
            overflow: hidden;
            z-index: 4;
            box-shadow: 0 0 0 4px rgba(10, 10, 20, 0.9), 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        .avatar-static img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .avatar-static::after {
            content: '';
            position: absolute;
            top: -150%;
            left: -60%;
            width: 50%;
            height: 400%;
            background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.3) 45%, rgba(255, 255, 255, 0.7) 50%, rgba(255, 255, 255, 0.3) 55%, transparent 100%);
            transform: rotate(28deg);
            animation: shineSweep 3.2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes shineSweep {
            0% {
                left: -65%;
            }

            40%,
            100% {
                left: 140%;
            }
        }

        .verified {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 28px;
            height: 28px;
            background: var(--neon-gold);
            border: 3px solid #0a0a14;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(245, 200, 66, 0.8);
            z-index: 6;
        }

        .verified svg {
            width: 14px;
            height: 14px;
        }

        .spark {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 7px;
            height: 7px;
            margin: -3.5px 0 0 -3.5px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            box-shadow: 0 0 12px 3px currentColor;
        }

        .spark.s1 {
            color: var(--neon-gold);
            background: var(--neon-gold);
            --orbit-radius: clamp(56px, 15vh, 78px);
            animation: orbit 4.5s linear infinite;
        }

        .spark.s2 {
            color: var(--neon-violet);
            background: var(--neon-violet);
            --orbit-radius: clamp(64px, 17vh, 86px);
            animation: orbit 5.8s linear infinite;
            animation-delay: -2s;
        }

        .spark.s3 {
            color: var(--neon-red);
            background: var(--neon-red);
            --orbit-radius: clamp(52px, 14vh, 72px);
            animation: orbit 3.8s linear infinite;
            animation-delay: -3.5s;
        }

        @keyframes orbit {
            from {
                transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg);
            }

            to {
                transform: rotate(360deg) translateX(var(--orbit-radius)) rotate(-360deg);
            }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(245, 200, 66, 0.6);
            color: var(--neon-gold);
            font-size: clamp(9px, 2.3vw, 11px);
            letter-spacing: 0.07em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 100px;
            font-weight: 800;
            white-space: nowrap;
            z-index: 3;
            box-shadow: 0 0 20px rgba(245, 200, 66, 0.2);
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--neon-red);
            box-shadow: 0 0 10px var(--neon-red);
            animation: dotBlink 1.6s ease-in-out infinite;
        }

        @keyframes dotBlink {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 12px var(--neon-red);
            }

            50% {
                opacity: 0.4;
                box-shadow: 0 0 4px var(--neon-red);
            }
        }

        h1.channel-name {
            font-family: var(--font-heading);
            font-size: clamp(32px, 10vw, 50px);
            line-height: 1.1;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            z-index: 3;
            margin: 0;

        h1.channel-name .word-gold {

        h1.channel-name .word-pink {

        p.tagline {

        .stats-row {
            display: flex;
            gap: clamp(12px, 3vw, 20px);
            justify-content: center;
            flex-wrap: wrap;
            z-index: 3;
        }

        .stat-item {
            display: flex;
            align-items: center;

            color: #b0b0cc;
            font-weight: 700;
        }

        .stat-num {
            color: #fff;
            font-weight: 900;
            font-size: clamp(13px, 3vw, 15px);
        }

        .stat-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .stat-dot.green {
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
        }

        .stat-dot.cyan {
            background: var(--neon-gold);
            box-shadow: 0 0 8px var(--neon-gold);
        }

        .buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 3;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: clamp(12px, 2.5vh, 15px) 16px;
            border-radius: var(--radius-btn);
            font-size: clamp(14px, 3.8vw, 17px);
            font-weight: 800;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform 0.14s ease, filter 0.14s ease;
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-body);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
            filter: brightness(0.9);
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-btn);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Primary button — Telegram styled */
        .btn-primary {
            background: linear-gradient(135deg, #2AABEE, #229ED9);
            color: #fff;
            box-shadow: 0 8px 24px rgba(42, 171, 238, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;

        /* Secondary button — Telegram outline */
        .btn-secondary {
            background: linear-gradient(135deg, #1a1a30, #12122a);

            border: 1.5px solid rgba(42, 171, 238, 0.6);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), 0 0 22px rgba(42, 171, 238, 0.2);
        }

        .btn svg {
            flex-shrink: 0;
            width: 19px;
            height: 19px;
        }

        .disclaimer {
            font-size: 9px;
            color: #8888aa;
            line-height: 1.4;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
            width: 100%;
            z-index: 3;
        }

        footer {

        }

        @media (max-width: 360px) {
            .card {
                padding: 12px 10px 10px;
                gap: 4px;

            }

            .avatar-stage {
                width: 85px;
                height: 85px;
            }

            .ring-1 {
                inset: -4px;
            }

            .ring-2 {
                inset: -10px;
            }

            .ring-3 {
                inset: -16px;
                border-width: 2px;
            }

            .verified {
                width: 22px;
                height: 22px;
            }

            .verified svg {
                width: 11px;
                height: 11px;
            }

            .spark.s1 {
                --orbit-radius: 44px;
            }

            .spark.s2 {
                --orbit-radius: 50px;
            }

            .spark.s3 {
                --orbit-radius: 40px;
            }

            h1.channel-name {

            }

            .btn {
                padding: 10px 12px;

            }

            .btn::after {

            }

            .btn svg {
                width: 16px;
                height: 16px;
            }

            .badge {
                font-size: 8px;
                padding: 5px 10px;
            }
        }
    </style>
</head>
